<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>You're offline | QChat</title>
    <style>
      body {
        background: #09090b;
        color: #fafafa;
        font: 16px system-ui;
        display: grid;
        place-content: center;
        min-height: 90vh;
        text-align: center;
        padding: 24px;
      }
      button {
        padding: 12px 24px;
        border-radius: 8px;
        border: 0;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1>You're offline</h1>
    <p>Reconnect to the internet to continue chatting.</p>
    <button id="retry">Try again</button>
    <script>
      document.getElementById("retry").onclick = () => location.reload();
    </script>
  </body>
</html>
